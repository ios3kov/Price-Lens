name: iOS

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild             -project PriceLens.xcodeproj             -scheme PriceLens             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Unit tests
        run: |
          xcodebuild             -project PriceLens.xcodeproj             -scheme PriceLens             -destination 'platform=iOS Simulator,name=iPhone 16 Pro'             CODE_SIGNING_ALLOWED=NO             test
