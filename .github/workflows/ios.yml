name: iOS

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project PriceLens.xcodeproj \
            -scheme PriceLens \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit test core
        run: |
          set -euo pipefail
          swift test
